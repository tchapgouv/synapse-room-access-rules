[tox]
envlist = py, check_codestyle, check_types

# required for PEP 517 (pyproject.toml-style) builds
isolated_build = true

[testenv:py]

extras = dev

commands =
  python -m twisted.trial tests

[testenv:check_codestyle]

extras = dev

commands =
  - ruff format --diff
  - ruff check --diff

[testenv:check_types]

extras = dev

commands =
  mypy room_access_rules
