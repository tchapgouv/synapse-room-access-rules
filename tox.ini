[tox]
envlist = py, check_codestyle, check_types

# required for PEP 517 (pyproject.toml-style) builds
isolated_build = true

[testenv:py]

extras = dev

commands =
  coverage run -m twisted.trial tests
  coverage xml
  coverage report

[testenv:check_codestyle]

extras = dev

commands =
  - black --check --diff room_access_rules tests
  - ruff check --diff room_access_rules tests

[testenv:check_types]

extras = dev

commands =
  mypy room_access_rules
